name: macOS packages
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-support]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
      - name: Native architecture and regression tests
        run: |
          node -e "if(process.arch !== '${{ matrix.arch }}') process.exit(1)"
          node _test/run-tests.cjs
      - name: Build DMG with bundled video and face-processing tools
        run: node build/mac.mjs
      - name: Install and smoke-test packaged application
        run: node _test/mac-smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/mac-${{ matrix.arch }}/*.dmg
            dist/mac-${{ matrix.arch }}/SHA256SUMS*.txt
            dist/mac-${{ matrix.arch }}/mac-smoke.json
            dist/mac-${{ matrix.arch }}/mac-main-window.png
          if-no-files-found: warn
          compression-level: 0
