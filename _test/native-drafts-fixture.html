<!doctype html><html><body>
<img alt="avatar" class="avatar" width="30" height="30"><span>我的创作</span>
<button id="new-work">新工作任务</button><button id="new-chat">新对话</button>
<aside data-testid="draft-conversation-section"></aside><nav id="recent"></nav><div id="messages"></div>
<form id="input-engine-container"><textarea placeholder="创建任务" style="width:600px;height:100px"></textarea>
<div id="attachments"></div><input type="file" multiple accept="image/*,video/*">
<button type="button" data-testid="chat_input_action_mode">对话</button>
<button type="submit" data-testid="chat_input_send_button">发送</button></form>
<script>
let saved=JSON.parse(localStorage.getItem('fixture')||'{"drafts":[],"conversations":[]}'),current=null,refs=[];
let editor=document.querySelector('textarea');
const mode=document.querySelector('[data-testid="chat_input_action_mode"]'),box=document.querySelector('aside'), messages=document.querySelector('#messages'),send=document.querySelector('[type="submit"]');
window.fixtureTrace=[];
const trace=event=>{window.fixtureTrace.push({event,at:Date.now(),performance:performance.now(),disabled:send.disabled});if(window.fixtureTrace.length>50)window.fixtureTrace.shift();};
const nativeTimeout=window.setTimeout;
window.setTimeout=function(callback,delay,...args){const start=performance.now();return nativeTimeout(()=>{if(performance.now()-start>2000)trace('delayed-timer:'+delay+':'+Math.round(performance.now()-start));callback(...args);},delay);};
new MutationObserver(()=>trace('send-attribute')).observe(send,{attributes:true});
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')trace('click:'+e.target.textContent);},true);
function persist(){localStorage.setItem('fixture',JSON.stringify(saved));}
function render(){
  for(const el of [...box.children])if(!saved.drafts.some(d=>d.id===el.id))el.remove();
  saved.drafts.forEach((d,i)=>{
    let row=document.getElementById(d.id);
    if(!row){row=document.createElement('div');row.id=d.id;row.setAttribute('role','button');row.className='group/conversation-item';row.innerHTML='<span><span></span></span>';row.onclick=()=>{leave();current=d.id;editor.value=d.prompt;mode.textContent=d.mode;refs=d.refs;history.pushState({},'', '/chat');messages.replaceChildren();render();};}
    row.querySelector('span span').textContent=d.prompt.slice(0,8);row.classList.toggle('bg-dbx-bg-float',current===d.id);
    if(box.children[i]!==row)box.insertBefore(row,box.children[i]||null);
  });
  document.querySelector('#attachments').textContent=refs.join(' ');
  document.querySelector('#recent').replaceChildren(...saved.conversations.map(c=>{const a=document.createElement('a');a.id='conversation_'+c.id;a.href='/chat/'+c.id;a.textContent=c.prompt;return a;}));
}
function leave(){if(editor.value.trim()){
  const item={id:current||'draft-'+Date.now(),prompt:editor.value,mode:mode.textContent,refs:refs.slice()};
  const existing=saved.drafts.find(d=>d.id===current);if(existing)Object.assign(existing,item);else saved.drafts.unshift(item);persist();
}}
function fresh(work){
  if(!/\/chat\/./.test(location.pathname)&&editor.value&&mode.textContent===(work?'云电脑':'对话'))return;
  leave();current=null;refs=[];editor.value='';document.querySelector('[type="file"]').value='';mode.textContent=work?'云电脑':'对话';messages.replaceChildren();history.pushState({},'','/chat');render();
  if(work)setTimeout(()=>{const next=editor.cloneNode();next.value='';editor.replaceWith(next);editor=next;},150);
}
document.querySelector('#new-work').onclick=()=>fresh(true);document.querySelector('#new-chat').onclick=()=>fresh(false);
document.querySelector('[type="file"]').onchange=e=>{send.disabled=true;trace('upload-start');refs=[...e.target.files].map(f=>f.name);setTimeout(()=>{render();send.disabled=false;trace('upload-ready');},300);};
async function show(c){
  messages.innerHTML='<div data-message-role="user" data-message-id="u-'+c.id+'"></div><div data-message-role="assistant" data-message-id="a-'+c.id+'">正在生成 10%</div>';
  messages.firstChild.textContent=c.prompt;
  while(location.pathname==='/chat/'+c.id){const ready=await(await fetch('/result-ready')).json();if(ready){messages.lastChild.innerHTML='生成完成 100%<video src="'+c.url+'" controls></video>';return;}await new Promise(r=>setTimeout(r,250));}
}
document.querySelector('form').onsubmit=async e=>{e.preventDefault();send.disabled=true;trace('submit');
 const payload={prompt:editor.value,mode:mode.textContent,refs:refs.slice()};const result=await(await fetch('/submit',{method:'POST',body:JSON.stringify(payload)})).json();
 saved.drafts=saved.drafts.filter(d=>d.id!==current);const c={...payload,...result};saved.conversations.unshift(c);persist();current=null;editor.value='';refs=[];
 history.pushState({},'','/chat/'+c.id);render();send.disabled=false;show(c);
};
render();const previous=saved.conversations.find(c=>location.pathname==='/chat/'+c.id);if(previous)show(previous);
</script></body></html>
